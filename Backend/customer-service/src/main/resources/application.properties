spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties],optional:file:../../.env[.properties]
server.port=${CUSTOMER_SERVICE_PORT:${SERVER_PORT:8084}}

spring.application.name=customer-service
jwt.secret=${JWT_SECRET}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}
cors.allowed-headers=${CORS_ALLOWED_HEADERS:Authorization,Content-Type,X-Requested-With}
cors.exposed-headers=${CORS_EXPOSED_HEADERS:X-Total-Count,X-Page-Number,Content-Disposition}
cors.max-age=${CORS_MAX_AGE:3600}
cors.allow-credentials=${CORS_ALLOW_CREDENTIALS:false}

spring.data.mongodb.uri=${CUSTOMER_MONGODB_URI:${MONGODB_URI}}
spring.data.mongodb.database=${CUSTOMER_MONGODB_DATABASE:retailtouch_customers}
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

logging.level.com.retailtouch=${LOG_LEVEL_RETAILTOUCH:INFO}
auth-service.url=${AUTH_SERVICE_URL}
