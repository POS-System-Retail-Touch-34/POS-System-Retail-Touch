spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties],optional:file:../../.env[.properties]
server.port=${AUTH_SERVICE_PORT:${SERVER_PORT:8081}}

spring.application.name=auth-service
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}
cors.allowed-headers=${CORS_ALLOWED_HEADERS:Authorization,Content-Type,X-Requested-With}
cors.exposed-headers=${CORS_EXPOSED_HEADERS:X-Total-Count,X-Page-Number,Content-Disposition}
cors.max-age=${CORS_MAX_AGE:3600}
cors.allow-credentials=${CORS_ALLOW_CREDENTIALS:true}

spring.datasource.url=jdbc:mysql://${AUTH_DB_HOST}:${AUTH_DB_PORT}/${AUTH_DB_NAME}?createDatabaseIfNotExist=${AUTH_DB_CREATE_IF_NOT_EXISTS:true}&allowPublicKeyRetrieval=${AUTH_DB_ALLOW_PUBLIC_KEY_RETRIEVAL:true}&useSSL=${AUTH_DB_USE_SSL:false}&serverTimezone=${AUTH_DB_SERVER_TIMEZONE:UTC}
spring.datasource.username=${AUTH_DB_USERNAME}
spring.datasource.password=${AUTH_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=${AUTH_JPA_DDL_AUTO:update}
spring.jpa.show-sql=${AUTH_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=${AUTH_JPA_FORMAT_SQL:false}

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

logging.level.com.retailtouch=${LOG_LEVEL_RETAILTOUCH:INFO}
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:WARN}

auth.allow-self-registration=${AUTH_ALLOW_SELF_REGISTRATION:false}
auth.bootstrap-default-users=${AUTH_BOOTSTRAP_DEFAULT_USERS:false}
auth.settings-encryption-key=${AUTH_SETTINGS_ENCRYPTION_KEY}
auth.bootstrap.admin.username=${AUTH_BOOTSTRAP_ADMIN_USERNAME:admin}
auth.bootstrap.admin.email=${AUTH_BOOTSTRAP_ADMIN_EMAIL:admin@retailtouch.com}
auth.bootstrap.admin.password=${AUTH_BOOTSTRAP_ADMIN_PASSWORD:}
auth.bootstrap.manager.username=${AUTH_BOOTSTRAP_MANAGER_USERNAME:manager}
auth.bootstrap.manager.email=${AUTH_BOOTSTRAP_MANAGER_EMAIL:manager@retailtouch.com}
auth.bootstrap.manager.password=${AUTH_BOOTSTRAP_MANAGER_PASSWORD:}
auth.bootstrap.cashier.username=${AUTH_BOOTSTRAP_CASHIER_USERNAME:cashier}
auth.bootstrap.cashier.email=${AUTH_BOOTSTRAP_CASHIER_EMAIL:cashier@retailtouch.com}
auth.bootstrap.cashier.password=${AUTH_BOOTSTRAP_CASHIER_PASSWORD:}
