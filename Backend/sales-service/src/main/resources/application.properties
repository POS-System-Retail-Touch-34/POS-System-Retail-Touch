spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties],optional:file:../../.env[.properties]
server.port=${SALES_SERVICE_PORT:${SERVER_PORT:8083}}

spring.application.name=sales-service
jwt.secret=${JWT_SECRET}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}
cors.allowed-headers=${CORS_ALLOWED_HEADERS:Authorization,Content-Type,X-Requested-With}
cors.exposed-headers=${CORS_EXPOSED_HEADERS:X-Total-Count,X-Page-Number,Content-Disposition}
cors.max-age=${CORS_MAX_AGE:3600}
cors.allow-credentials=${CORS_ALLOW_CREDENTIALS:false}

spring.data.mongodb.uri=${SALES_MONGODB_URI:${MONGODB_URI}}
spring.data.mongodb.database=${SALES_MONGODB_DATABASE:retailtouch_sales}
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

feign.client.config.default.connectTimeout=${FEIGN_CONNECT_TIMEOUT:5000}
feign.client.config.default.readTimeout=${FEIGN_READ_TIMEOUT:5000}

inventory-service.url=${INVENTORY_SERVICE_URL}
customer-service.url=${CUSTOMER_SERVICE_URL}

sales.tax-rate=${TAX_RATE:0.18}
sales.invoice-prefix=${INVOICE_PREFIX:INV}
sales.loyalty-conversion-rate=${LOYALTY_CONVERSION_RATE:1}

razorpay.key=${RAZORPAY_KEY}
razorpay.secret=${RAZORPAY_SECRET}
razorpay.orders-url=${RAZORPAY_ORDERS_URL:https://api.razorpay.com/v1/orders}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

logging.level.com.retailtouch=${LOG_LEVEL_RETAILTOUCH:INFO}
auth-service.url=${AUTH_SERVICE_URL}
