spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties],optional:file:../../.env[.properties]
server.port=${GATEWAY_SERVICE_PORT:${SERVER_PORT:8080}}

spring.application.name=gateway-service
jwt.secret=${JWT_SECRET}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS,PATCH}
cors.allowed-headers=${CORS_ALLOWED_HEADERS:*}
cors.exposed-headers=${CORS_EXPOSED_HEADERS:X-Total-Count,X-Page-Number,Content-Disposition}
cors.max-age=${CORS_MAX_AGE:3600}
cors.allow-credentials=${CORS_ALLOW_CREDENTIALS:true}


spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins[0]=http://localhost:3000
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins[1]=http://localhost:5173

spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods[0]=GET
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods[1]=POST
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods[2]=PUT
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods[3]=DELETE
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods[4]=OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods[5]=PATCH
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=${CORS_ALLOWED_HEADERS:*}
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=${CORS_ALLOW_CREDENTIALS:true}
spring.cloud.gateway.globalcors.cors-configurations.[/**].maxAge=${CORS_MAX_AGE:3600}
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=${AUTH_SERVICE_URL}
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**, /api/users/**, /api/settings/**
spring.cloud.gateway.routes[1].id=inventory-service
spring.cloud.gateway.routes[1].uri=${INVENTORY_SERVICE_URL}
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/products/**, /api/categories/**, /api/stock/**, /api/inventory/**, /categories/**
spring.cloud.gateway.routes[2].id=sales-service
spring.cloud.gateway.routes[2].uri=${SALES_SERVICE_URL}
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/sales/**
spring.cloud.gateway.routes[3].id=customer-service
spring.cloud.gateway.routes[3].uri=${CUSTOMER_SERVICE_URL}
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/customers/**
spring.cloud.gateway.routes[4].id=reporting-service
spring.cloud.gateway.routes[4].uri=${REPORTING_SERVICE_URL}
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/reports/**
spring.cloud.gateway.routes[5].id=notification-service
spring.cloud.gateway.routes[5].uri=${NOTIFICATION_SERVICE_URL}
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/notifications/**
spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true

management.endpoints.web.exposure.include=${ACTUATOR_ENDPOINTS:health,info}
management.endpoint.health.show-details=${ACTUATOR_HEALTH_SHOW_DETAILS:never}

logging.level.com.retailtouch=${LOG_LEVEL_RETAILTOUCH:INFO}
logging.level.org.springframework.cloud.gateway=${LOG_LEVEL_GATEWAY:INFO}
